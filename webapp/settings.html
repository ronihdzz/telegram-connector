<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚙️ Settings - GymBot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--tg-theme-text-color, #000000);
        }

        .header p {
            color: var(--tg-theme-hint-color, #666);
            font-size: 16px;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #f8f9fa);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: var(--tg-theme-text-color, #000000);
        }

        .setting-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(0, 136, 204, 0.1);
        }

        .setting-item:last-child {
            border-bottom: none;
        }

        .setting-label {
            font-weight: 500;
            color: var(--tg-theme-text-color, #000000);
        }

        .setting-value {
            color: var(--tg-theme-hint-color, #666);
            font-size: 14px;
        }

        select {
            background: var(--tg-theme-bg-color, #ffffff);
            border: 1px solid var(--tg-theme-button-color, #0088cc);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--tg-theme-text-color, #000000);
            font-size: 14px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            margin-bottom: 10px;
        }

        .btn-primary {
            background: var(--tg-theme-button-color, #0088cc);
            color: white;
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-secondary {
            background: var(--tg-theme-secondary-bg-color, #f8f9fa);
            color: var(--tg-theme-text-color, #000000);
            border: 1px solid var(--tg-theme-button-color, #0088cc);
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .delete-section {
            background: #fff5f5;
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .delete-warning {
            color: #dc2626;
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.4;
        }

        .confirmation-step {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .confirmation-text {
            font-size: 18px;
            font-weight: 600;
            color: #dc2626;
            margin-bottom: 15px;
        }

        .confirmation-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #dc2626;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            margin-bottom: 15px;
        }

        .success-message, .error-message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: 500;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ Settings</h1>
            <p>GymBot - Configuración</p>
        </div>

        <!-- Configuración General -->
        <div class="card">
            <h2>🌐 Idioma</h2>
            <div class="setting-item">
                <span class="setting-label">Idioma de la aplicación</span>
                <select id="languageSelect">
                    <option value="es">🇪🇸 Español</option>
                    <option value="en">🇺🇸 English</option>
                </select>
            </div>
        </div>

        <!-- Sección de Eliminar Cuenta -->
        <div class="delete-section" id="deleteSection">
            <h2 style="color: #dc2626; margin-bottom: 15px;">🗑️ Eliminar Cuenta</h2>
            <div class="delete-warning">
                ⚠️ <strong>Advertencia:</strong> Esta acción eliminará permanentemente tu cuenta y todos tus datos. No se puede deshacer.
            </div>
            <button class="btn btn-danger" onclick="startDeleteProcess()">
                Eliminar mi cuenta
            </button>
        </div>

        <!-- Confirmación de Eliminación -->
        <div class="confirmation-step" id="confirmationStep">
            <div class="confirmation-text">
                ¿Estás completamente seguro?
            </div>
            <p style="margin-bottom: 20px; color: #666;">
                Escribe <strong>ELIMINAR</strong> para confirmar:
            </p>
            <input type="text" class="confirmation-input" id="confirmationInput" placeholder="Escribe ELIMINAR">
            <button class="btn btn-danger" id="finalDeleteBtn" onclick="confirmDelete()" disabled>
                Confirmar eliminación
            </button>
            <button class="btn btn-secondary" onclick="cancelDelete()">
                Cancelar
            </button>
        </div>

        <div id="messageContainer"></div>
    </div>

    <script>
        // Inicializar Telegram WebApp
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        // Cargar configuración guardada
        function loadSettings() {
            const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
            if (tgUser) {
                const saved = localStorage.getItem('gymbot_settings_' + tgUser.id);
                if (saved) {
                    const settings = JSON.parse(saved);
                    document.getElementById('languageSelect').value = settings.language || 'es';
                }
            }
        }

        // Guardar idioma
        document.getElementById('languageSelect').addEventListener('change', function() {
            const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
            if (tgUser) {
                const settings = {
                    language: this.value
                };
                localStorage.setItem('gymbot_settings_' + tgUser.id, JSON.stringify(settings));
                showMessage('Idioma actualizado correctamente', 'success');
            }
        });

        // Iniciar proceso de eliminación
        function startDeleteProcess() {
            document.getElementById('deleteSection').style.display = 'none';
            document.getElementById('confirmationStep').style.display = 'block';
        }

        // Cancelar eliminación
        function cancelDelete() {
            document.getElementById('deleteSection').style.display = 'block';
            document.getElementById('confirmationStep').style.display = 'none';
            document.getElementById('confirmationInput').value = '';
        }

        // Validar confirmación
        document.getElementById('confirmationInput').addEventListener('input', function() {
            const btn = document.getElementById('finalDeleteBtn');
            btn.disabled = this.value.toUpperCase() !== 'ELIMINAR';
        });

        // Confirmar eliminación
        function confirmDelete() {
            const input = document.getElementById('confirmationInput');
            if (input.value.toUpperCase() !== 'ELIMINAR') {
                showMessage('Debes escribir exactamente "ELIMINAR" para confirmar', 'error');
                return;
            }

            // Simular eliminación
            showMessage('Eliminando cuenta...', 'success');
            
            setTimeout(() => {
                // Enviar datos de eliminación a Telegram
                const deleteData = {
                    action: 'delete_account',
                    confirmed: true,
                    timestamp: Date.now()
                };

                try {
                    window.Telegram.WebApp.sendData(JSON.stringify(deleteData));
                    
                    showMessage('✅ Cuenta eliminada exitosamente', 'success');
                    
                    // Cerrar después de un momento
                    setTimeout(() => {
                        window.Telegram.WebApp.close();
                    }, 2000);
                    
                } catch (error) {
                    console.error('Error:', error);
                    showMessage('❌ Error al eliminar cuenta. Intenta de nuevo.', 'error');
                }
            }, 1500);
        }

        // Mostrar mensaje
        function showMessage(text, type) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="${type}-message">${text}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }

        // Cargar configuración al iniciar
        loadSettings();

        // Configurar botón principal de Telegram
        window.Telegram.WebApp.MainButton.text = 'Guardar Configuración';
        window.Telegram.WebApp.MainButton.show();

        window.Telegram.WebApp.MainButton.onClick(() => {
            showMessage('Configuración guardada', 'success');
            setTimeout(() => {
                window.Telegram.WebApp.close();
            }, 1500);
        });
    </script>
</body>
</html>
