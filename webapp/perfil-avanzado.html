<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👤 Perfil Avanzado - FitBot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
            padding: 20px;
            background: linear-gradient(135deg, var(--tg-theme-button-color, #0088cc), #0066aa);
            border-radius: 16px;
            color: var(--tg-theme-button-text-color, #ffffff);
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .profile-card {
            background: var(--tg-theme-secondary-bg-color, #f8f9fa);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 24px;
            border: 2px solid var(--tg-theme-button-color, #0088cc);
        }

        .profile-card h2 {
            color: var(--tg-theme-text-color, #000000);
            margin-bottom: 16px;
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--tg-theme-text-color, #000000);
            font-size: 16px;
        }

        .form-control {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid var(--tg-theme-button-color, #0088cc);
            border-radius: 12px;
            font-size: 16px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            transition: all 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #0088cc);
            box-shadow: 0 0 0 4px rgba(0, 136, 204, 0.1);
            transform: translateY(-1px);
        }

        .form-control::placeholder {
            color: var(--tg-theme-hint-color, #999999);
        }

        select.form-control {
            cursor: pointer;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--tg-theme-bg-color, #ffffff);
            border: 2px solid var(--tg-theme-button-color, #0088cc);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #0088cc);
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 12px;
            color: var(--tg-theme-hint-color, #999999);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, var(--tg-theme-button-color, #0088cc), #0066aa);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 18px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 24px;
            box-shadow: 0 4px 12px rgba(0, 136, 204, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(0, 136, 204, 0.4);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .success-message {
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            color: #155724;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px solid #c3e6cb;
            font-weight: 500;
        }

        .error-message {
            background: linear-gradient(135deg, #f8d7da, #f5c6cb);
            color: #721c24;
            padding: 16px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px solid #f5c6cb;
            font-weight: 500;
        }

        .input-group {
            position: relative;
        }

        .input-group-text {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--tg-theme-hint-color, #999999);
            font-size: 14px;
            pointer-events: none;
        }

        .checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: var(--tg-theme-bg-color, #ffffff);
            border: 2px solid var(--tg-theme-button-color, #0088cc);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .checkbox-item:hover {
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }

        .checkbox-item input[type="checkbox"] {
            display: none;
        }

        .checkbox-item input[type="checkbox"]:checked + .checkbox-item {
            background: var(--tg-theme-button-color, #0088cc);
            color: var(--tg-theme-button-text-color, #ffffff);
        }

        @media (max-width: 480px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 12px;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 Perfil Avanzado</h1>
            <p>Completa tu información para una experiencia personalizada</p>
        </div>

        <div id="messages"></div>

        <form id="perfilForm">
            <!-- Información Básica -->
            <div class="profile-card">
                <h2>📝 Información Básica</h2>
                
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" class="form-control" placeholder="Tu nombre completo" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="edad">Edad</label>
                        <input type="number" id="edad" class="form-control" placeholder="25" min="13" max="120" required>
                    </div>
                    <div class="form-group">
                        <label for="genero">Género</label>
                        <select id="genero" class="form-control" required>
                            <option value="">Seleccionar</option>
                            <option value="masculino">👨 Masculino</option>
                            <option value="femenino">👩 Femenino</option>
                            <option value="otro">🏳️‍⚧️ Otro</option>
                            <option value="prefiero_no_decir">🤐 Prefiero no decir</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Información Física -->
            <div class="profile-card">
                <h2>📏 Información Física</h2>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="peso">Peso Actual</label>
                        <div class="input-group">
                            <input type="number" id="peso" class="form-control" placeholder="70" min="30" max="300" step="0.1" required>
                            <span class="input-group-text">kg</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="altura">Altura</label>
                        <div class="input-group">
                            <input type="number" id="altura" class="form-control" placeholder="175" min="100" max="250" required>
                            <span class="input-group-text">cm</span>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="peso_objetivo">Peso Objetivo</label>
                        <div class="input-group">
                            <input type="number" id="peso_objetivo" class="form-control" placeholder="65" min="30" max="300" step="0.1">
                            <span class="input-group-text">kg</span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="nivel_actividad">Nivel de Actividad</label>
                        <select id="nivel_actividad" class="form-control" required>
                            <option value="">Seleccionar</option>
                            <option value="sedentario">😴 Sedentario</option>
                            <option value="ligero">🚶 Ligero (1-3 días/semana)</option>
                            <option value="moderado">🏃 Moderado (3-5 días/semana)</option>
                            <option value="activo">💪 Activo (6-7 días/semana)</option>
                            <option value="muy_activo">🏋️ Muy Activo (2x/día)</option>
                        </select>
                    </div>
                </div>

                <!-- Estadísticas calculadas -->
                <div class="stats-grid" id="statsGrid" style="display: none;">
                    <div class="stat-card">
                        <div class="stat-value" id="imcValue">--</div>
                        <div class="stat-label">IMC</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="tmrValue">--</div>
                        <div class="stat-label">TMR</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="caloriasValue">--</div>
                        <div class="stat-label">Calorías/día</div>
                    </div>
                </div>
            </div>

            <!-- Objetivos Fitness -->
            <div class="profile-card">
                <h2>🎯 Objetivos Fitness</h2>
                
                <div class="form-group">
                    <label for="objetivo_principal">Objetivo Principal</label>
                    <select id="objetivo_principal" class="form-control" required>
                        <option value="">Seleccionar objetivo</option>
                        <option value="perder_peso">⚖️ Perder Peso</option>
                        <option value="ganar_musculo">💪 Ganar Músculo</option>
                        <option value="mantener_peso">⚖️ Mantener Peso</option>
                        <option value="mejorar_resistencia">🏃 Mejorar Resistencia</option>
                        <option value="aumentar_fuerza">🏋️ Aumentar Fuerza</option>
                        <option value="tonificar">✨ Tonificar</option>
                        <option value="rehabilitacion">🏥 Rehabilitación</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Áreas de Enfoque</label>
                    <div class="checkbox-group">
                        <label class="checkbox-item">
                            <input type="checkbox" name="areas_enfoque" value="pecho">
                            💪 Pecho
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="areas_enfoque" value="espalda">
                            🔙 Espalda
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="areas_enfoque" value="brazos">
                            💪 Brazos
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="areas_enfoque" value="piernas">
                            🦵 Piernas
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="areas_enfoque" value="abdomen">
                            🔥 Abdomen
                        </label>
                        <label class="checkbox-item">
                            <input type="checkbox" name="areas_enfoque" value="cardio">
                            ❤️ Cardio
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="experiencia">Experiencia en Fitness</label>
                    <select id="experiencia" class="form-control" required>
                        <option value="">Seleccionar nivel</option>
                        <option value="principiante">🌱 Principiante (0-6 meses)</option>
                        <option value="intermedio">🌿 Intermedio (6 meses - 2 años)</option>
                        <option value="avanzado">🌳 Avanzado (2+ años)</option>
                        <option value="experto">🏆 Experto (5+ años)</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                💾 Guardar Perfil Avanzado
            </button>
        </form>
    </div>

    <script>
        // Inicializar Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.ready();

        // Configurar tema
        document.body.style.backgroundColor = tg.themeParams.bg_color || '#ffffff';

        function mostrarMensaje(mensaje, tipo = 'success') {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = tipo === 'success' ? 'success-message' : 'error-message';
            messageDiv.textContent = mensaje;
            messagesDiv.innerHTML = '';
            messagesDiv.appendChild(messageDiv);
            
            setTimeout(() => {
                messageDiv.remove();
            }, 5000);
        }

        function calcularEstadisticas() {
            const peso = parseFloat(document.getElementById('peso').value);
            const altura = parseFloat(document.getElementById('altura').value);
            const edad = parseInt(document.getElementById('edad').value);
            const genero = document.getElementById('genero').value;
            const nivelActividad = document.getElementById('nivel_actividad').value;

            if (peso && altura && edad && genero) {
                // Calcular IMC
                const alturaM = altura / 100;
                const imc = peso / (alturaM * alturaM);
                
                // Calcular TMR (Tasa Metabólica en Reposo)
                let tmr;
                if (genero === 'masculino') {
                    tmr = 88.362 + (13.397 * peso) + (4.799 * altura) - (5.677 * edad);
                } else {
                    tmr = 447.593 + (9.247 * peso) + (3.098 * altura) - (4.330 * edad);
                }

                // Calcular calorías diarias según nivel de actividad
                const factoresActividad = {
                    'sedentario': 1.2,
                    'ligero': 1.375,
                    'moderado': 1.55,
                    'activo': 1.725,
                    'muy_activo': 1.9
                };
                
                const calorias = tmr * (factoresActividad[nivelActividad] || 1.2);

                // Mostrar estadísticas
                document.getElementById('imcValue').textContent = imc.toFixed(1);
                document.getElementById('tmrValue').textContent = Math.round(tmr);
                document.getElementById('caloriasValue').textContent = Math.round(calorias);
                document.getElementById('statsGrid').style.display = 'grid';
            }
        }

        // Event listeners para cálculo automático
        ['peso', 'altura', 'edad', 'genero', 'nivel_actividad'].forEach(id => {
            document.getElementById(id).addEventListener('input', calcularEstadisticas);
            document.getElementById(id).addEventListener('change', calcularEstadisticas);
        });

        // Manejar envío del formulario
        document.getElementById('perfilForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Guardando perfil...';
            
            try {
                // Recopilar datos del formulario
                const formData = new FormData(this);
                
                // Obtener áreas de enfoque seleccionadas
                const areasEnfoque = Array.from(document.querySelectorAll('input[name="areas_enfoque"]:checked'))
                    .map(checkbox => checkbox.value);
                
                // Preparar datos del perfil
                const perfilData = {
                    type: 'perfil_avanzado',
                    perfil: {
                        // Información básica
                        nombre: document.getElementById('nombre').value,
                        edad: parseInt(document.getElementById('edad').value),
                        genero: document.getElementById('genero').value,
                        
                        // Información física
                        peso: parseFloat(document.getElementById('peso').value),
                        altura: parseInt(document.getElementById('altura').value),
                        peso_objetivo: parseFloat(document.getElementById('peso_objetivo').value) || null,
                        nivel_actividad: document.getElementById('nivel_actividad').value,
                        
                        // Objetivos
                        objetivo_principal: document.getElementById('objetivo_principal').value,
                        areas_enfoque: areasEnfoque,
                        experiencia: document.getElementById('experiencia').value,
                        
                        // Estadísticas calculadas
                        imc: parseFloat(document.getElementById('imcValue').textContent) || null,
                        tmr: parseInt(document.getElementById('tmrValue').textContent) || null,
                        calorias_diarias: parseInt(document.getElementById('caloriasValue').textContent) || null,
                        
                        fecha_actualizacion: new Date().toISOString()
                    }
                };
                
                // Validaciones básicas
                if (!perfilData.perfil.nombre || !perfilData.perfil.edad || !perfilData.perfil.peso) {
                    throw new Error('Por favor completa todos los campos obligatorios');
                }
                
                if (perfilData.perfil.edad < 13 || perfilData.perfil.edad > 120) {
                    throw new Error('La edad debe estar entre 13 y 120 años');
                }
                
                // Enviar datos a Telegram
                tg.sendData(JSON.stringify(perfilData));
                
                mostrarMensaje('✅ ¡Perfil guardado exitosamente!', 'success');
                
                // Cerrar la webapp después de un breve delay
                setTimeout(() => {
                    tg.close();
                }, 2000);
                
            } catch (error) {
                console.error('Error:', error);
                mostrarMensaje('❌ Error: ' + error.message, 'error');
                
                submitBtn.disabled = false;
                submitBtn.textContent = '💾 Guardar Perfil Avanzado';
            }
        });

        // Configurar botón principal de Telegram
        tg.MainButton.text = "💾 Guardar Perfil";
        tg.MainButton.show();
        
        tg.MainButton.onClick(function() {
            document.getElementById('perfilForm').dispatchEvent(new Event('submit'));
        });

        // Validación en tiempo real
        document.getElementById('perfilForm').addEventListener('input', function() {
            const requiredFields = ['nombre', 'edad', 'genero', 'peso', 'altura', 'nivel_actividad', 'objetivo_principal', 'experiencia'];
            let isValid = true;
            
            requiredFields.forEach(fieldId => {
                const field = document.getElementById(fieldId);
                if (!field.value) {
                    isValid = false;
                }
            });
            
            if (isValid) {
                tg.MainButton.enable();
                document.getElementById('submitBtn').disabled = false;
            } else {
                tg.MainButton.disable();
                document.getElementById('submitBtn').disabled = true;
            }
        });

        // Configurar botón de retroceso
        tg.BackButton.show();
        tg.BackButton.onClick(function() {
            tg.close();
        });

        // Cargar datos del usuario si están disponibles
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            if (user.first_name) {
                document.getElementById('nombre').value = user.first_name + (user.last_name ? ' ' + user.last_name : '');
            }
        }

        console.log('👤 Perfil Avanzado Mini App cargada correctamente');
    </script>
</body>
</html>
