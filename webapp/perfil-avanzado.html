<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>👤 Perfil - GymBot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 16px;
            min-height: 100vh;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            padding: 16px;
            background: var(--tg-theme-button-color, #0088cc);
            border-radius: 12px;
            color: white;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .card {
            background: var(--tg-theme-secondary-bg-color, #f8f9fa);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid var(--tg-theme-button-color, #0088cc);
        }

        .card h2 {
            color: var(--tg-theme-text-color, #000000);
            margin-bottom: 12px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .profile-info {
            display: grid;
            gap: 12px;
        }

        .info-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0, 136, 204, 0.1);
        }

        .info-label {
            font-weight: 600;
            color: var(--tg-theme-hint-color, #666);
        }

        .info-value {
            font-size: 16px;
            color: var(--tg-theme-text-color, #000);
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: var(--tg-theme-text-color, #000000);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--tg-theme-button-color, #0088cc);
            border-radius: 8px;
            font-size: 16px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #0088cc);
            box-shadow: 0 0 0 2px rgba(0, 136, 204, 0.1);
        }

        .btn {
            width: 100%;
            background: var(--tg-theme-button-color, #0088cc);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-secondary {
            background: var(--tg-theme-secondary-bg-color, #f8f9fa);
            color: var(--tg-theme-text-color, #000000);
            border: 1px solid var(--tg-theme-button-color, #0088cc);
        }

        .workouts-list {
            max-height: 200px;
            overflow-y: auto;
        }

        .workout-item {
            background: var(--tg-theme-bg-color, #ffffff);
            border: 1px solid rgba(0, 136, 204, 0.2);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 8px;
        }

        .workout-date {
            font-weight: 600;
            color: var(--tg-theme-button-color, #0088cc);
            margin-bottom: 4px;
        }

        .workout-exercises {
            font-size: 14px;
            color: var(--tg-theme-hint-color, #666);
        }

        .empty-state {
            text-align: center;
            color: var(--tg-theme-hint-color, #666);
            padding: 20px;
        }

        .success-message, .error-message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-weight: 500;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .error-message {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👤 Mi Perfil</h1>
            <p>GymBot</p>
        </div>

        <!-- Información del Perfil -->
        <div class="card">
            <h2>📋 Información Personal</h2>
            <div class="profile-info">
                <div class="info-item">
                    <span class="info-label">Nombre:</span>
                    <span class="info-value" id="userName">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Edad:</span>
                    <span class="info-value" id="userAge">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Chat ID:</span>
                    <span class="info-value" id="chatId">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label">Registrado:</span>
                    <span class="info-value" id="registerDate">-</span>
                </div>
            </div>
            <button class="btn" onclick="editProfile()">✏️ Editar Perfil</button>
        </div>

        <!-- Mis Entrenamientos -->
        <div class="card">
            <h2>🏋️ Mis Entrenamientos</h2>
            <div class="workouts-list" id="workoutsList">
                <div class="empty-state">
                    <p>No tienes entrenamientos registrados</p>
                </div>
            </div>
        </div>

        <!-- Registrar Entrenamiento del Día -->
        <div class="card">
            <h2>📝 Registrar Entrenamiento de Hoy</h2>
            <div class="form-group">
                <label>Ejercicios (uno por línea):</label>
                <textarea class="form-control" id="todayExercises" rows="4" 
                    placeholder="Ej:&#10;Press banca&#10;Sentadillas&#10;Dominadas"></textarea>
            </div>
            <button class="btn" onclick="saveTodayWorkout()">💾 Guardar Entrenamiento</button>
        </div>

        <!-- Modal de Edición -->
        <div id="editModal" style="display: none;">
            <div class="card">
                <h2>✏️ Editar Perfil</h2>
                <div class="form-group">
                    <label>Nombre:</label>
                    <input type="text" class="form-control" id="editName" placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label>Edad:</label>
                    <input type="number" class="form-control" id="editAge" placeholder="Tu edad" min="1" max="120">
                </div>
                <button class="btn" onclick="saveProfile()">💾 Guardar</button>
                <button class="btn btn-secondary" onclick="cancelEdit()">❌ Cancelar</button>
            </div>
        </div>

        <div id="messageContainer"></div>
    </div>

    <script>
        // Inicializar Telegram WebApp
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        // Datos del usuario
        let userData = {};
        let workouts = [];

        // Cargar datos iniciales
        function loadUserData() {
            const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
            if (tgUser) {
                document.getElementById('userName').textContent = tgUser.first_name + (tgUser.last_name ? ' ' + tgUser.last_name : '');
                document.getElementById('chatId').textContent = tgUser.id;
                
                // Cargar datos guardados del localStorage
                const saved = localStorage.getItem('gymbot_profile_' + tgUser.id);
                if (saved) {
                    userData = JSON.parse(saved);
                    document.getElementById('userAge').textContent = userData.age || '-';
                    document.getElementById('registerDate').textContent = userData.registerDate || new Date().toLocaleDateString();
                } else {
                    document.getElementById('registerDate').textContent = new Date().toLocaleDateString();
                }
                
                loadWorkouts();
            }
        }

        // Cargar entrenamientos
        function loadWorkouts() {
            const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
            if (tgUser) {
                const saved = localStorage.getItem('gymbot_workouts_' + tgUser.id);
                if (saved) {
                    workouts = JSON.parse(saved);
                    displayWorkouts();
                }
            }
        }

        // Mostrar entrenamientos
        function displayWorkouts() {
            const container = document.getElementById('workoutsList');
            if (workouts.length === 0) {
                container.innerHTML = '<div class="empty-state"><p>No tienes entrenamientos registrados</p></div>';
                return;
            }

            container.innerHTML = workouts.map(workout => `
                <div class="workout-item">
                    <div class="workout-date">${workout.date}</div>
                    <div class="workout-exercises">${workout.exercises.join(', ')}</div>
                </div>
            `).join('');
        }

        // Editar perfil
        function editProfile() {
            document.getElementById('editName').value = document.getElementById('userName').textContent;
            document.getElementById('editAge').value = document.getElementById('userAge').textContent !== '-' ? document.getElementById('userAge').textContent : '';
            document.getElementById('editModal').style.display = 'block';
        }

        // Guardar perfil
        function saveProfile() {
            const name = document.getElementById('editName').value.trim();
            const age = document.getElementById('editAge').value;

            if (!name || !age) {
                showMessage('Por favor completa todos los campos', 'error');
                return;
            }

            const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
            if (tgUser) {
                userData = {
                    name: name,
                    age: age,
                    registerDate: userData.registerDate || new Date().toLocaleDateString()
                };

                localStorage.setItem('gymbot_profile_' + tgUser.id, JSON.stringify(userData));
                
                document.getElementById('userName').textContent = name;
                document.getElementById('userAge').textContent = age;
                
                cancelEdit();
                showMessage('Perfil actualizado correctamente', 'success');
            }
        }

        // Cancelar edición
        function cancelEdit() {
            document.getElementById('editModal').style.display = 'none';
        }

        // Guardar entrenamiento del día
        function saveTodayWorkout() {
            const exercisesText = document.getElementById('todayExercises').value.trim();
            if (!exercisesText) {
                showMessage('Agrega al menos un ejercicio', 'error');
                return;
            }

            const exercises = exercisesText.split('\n').filter(ex => ex.trim()).map(ex => ex.trim());
            const today = new Date().toLocaleDateString();
            
            // Remover entrenamiento existente del día si existe
            workouts = workouts.filter(w => w.date !== today);
            
            // Agregar nuevo entrenamiento
            workouts.unshift({
                date: today,
                exercises: exercises
            });

            const tgUser = window.Telegram.WebApp.initDataUnsafe?.user;
            if (tgUser) {
                localStorage.setItem('gymbot_workouts_' + tgUser.id, JSON.stringify(workouts));
                displayWorkouts();
                document.getElementById('todayExercises').value = '';
                showMessage('Entrenamiento guardado para hoy', 'success');
            }
        }

        // Mostrar mensaje
        function showMessage(text, type) {
            const container = document.getElementById('messageContainer');
            container.innerHTML = `<div class="${type}-message">${text}</div>`;
            setTimeout(() => {
                container.innerHTML = '';
            }, 3000);
        }

        // Cargar datos al iniciar
        loadUserData();
    </script>
</body>
</html>
