<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Registro - GymBot</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 8px;
            color: var(--tg-theme-text-color, #000000);
        }

        .header p {
            color: var(--tg-theme-hint-color, #666);
            font-size: 16px;
        }

        .form-card {
            background: var(--tg-theme-secondary-bg-color, #f8f9fa);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--tg-theme-text-color, #000000);
        }

        .form-input {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--tg-theme-button-color, #0088cc);
            border-radius: 8px;
            font-size: 16px;
            background: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }

        .form-input:focus {
            outline: none;
            border-color: var(--tg-theme-button-color, #0088cc);
            box-shadow: 0 0 0 2px rgba(0, 136, 204, 0.1);
        }

        .submit-btn {
            width: 100%;
            background: var(--tg-theme-button-color, #0088cc);
            color: white;
            border: none;
            padding: 16px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .error-message {
            color: #dc3545;
            font-size: 14px;
            margin-top: 5px;
        }

        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }

        .loading {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 Registro</h1>
            <p>GymBot - Completa tu perfil</p>
        </div>

        <div class="form-card">
            <form id="registrationForm">
                <div class="form-group">
                    <label for="name">Nombre</label>
                    <input type="text" id="name" class="form-input" placeholder="Tu nombre" required>
                    <div class="error-message" id="nameError"></div>
                </div>

                <div class="form-group">
                    <label for="age">Edad</label>
                    <input type="number" id="age" class="form-input" placeholder="Tu edad" min="13" max="120" required>
                    <div class="error-message" id="ageError"></div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    Registrarse
                </button>
            </form>
        </div>

        <div id="messageContainer"></div>
    </div>

    <script>
        // Inicializar Telegram WebApp
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        const form = document.getElementById('registrationForm');
        const nameInput = document.getElementById('name');
        const ageInput = document.getElementById('age');
        const submitBtn = document.getElementById('submitBtn');

        // Validaciones simples
        function validateName() {
            const name = nameInput.value.trim();
            const errorEl = document.getElementById('nameError');
            
            if (name.length < 2) {
                errorEl.textContent = 'El nombre debe tener al menos 2 caracteres';
                return false;
            }
            
            errorEl.textContent = '';
            return true;
        }

        function validateAge() {
            const age = parseInt(ageInput.value);
            const errorEl = document.getElementById('ageError');
            
            if (isNaN(age) || age < 13 || age > 120) {
                errorEl.textContent = 'Edad debe estar entre 13 y 120 años';
                return false;
            }
            
            errorEl.textContent = '';
            return true;
        }

        // Validación en tiempo real
        nameInput.addEventListener('input', validateName);
        ageInput.addEventListener('input', validateAge);

        // Envío del formulario
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!validateName() || !validateAge()) {
                return;
            }

            submitBtn.classList.add('loading');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Registrando...';

            const formData = {
                name: nameInput.value.trim(),
                age: parseInt(ageInput.value)
            };

            try {
                // Simular delay
                await new Promise(resolve => setTimeout(resolve, 1000));

                // Enviar datos a Telegram
                window.Telegram.WebApp.sendData(JSON.stringify(formData));
                
                // Mostrar éxito
                document.getElementById('messageContainer').innerHTML = 
                    '<div class="success-message">✅ Registro completado exitosamente</div>';
                
                // Cerrar después de un momento
                setTimeout(() => {
                    window.Telegram.WebApp.close();
                }, 2000);

            } catch (error) {
                console.error('Error:', error);
                submitBtn.classList.remove('loading');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Registrarse';
                
                document.getElementById('messageContainer').innerHTML = 
                    '<div class="error-message">❌ Error al registrar. Intenta de nuevo.</div>';
            }
        });

        // Configurar botón principal de Telegram
        window.Telegram.WebApp.MainButton.text = 'Registrarse';
        window.Telegram.WebApp.MainButton.show();

        window.Telegram.WebApp.MainButton.onClick(() => {
            form.dispatchEvent(new Event('submit'));
        });
    </script>
</body>
</html>
