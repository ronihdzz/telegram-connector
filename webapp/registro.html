<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Registro de Usuario</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --tg-theme-bg-color: #ffffff;
            --tg-theme-text-color: #000000;
            --tg-theme-hint-color: #999999;
            --tg-theme-link-color: #2481cc;
            --tg-theme-button-color: #2481cc;
            --tg-theme-button-text-color: #ffffff;
            --tg-theme-secondary-bg-color: #f1f1f1;
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-color: #10b981;
            --error-color: #ef4444;
            --border-radius: 16px;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
            background: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideDown 0.6s ease-out;
        }

        .header-icon {
            font-size: 64px;
            margin-bottom: 16px;
            animation: bounce 1.5s infinite;
        }

        .header-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-subtitle {
            color: var(--tg-theme-hint-color);
            font-size: 16px;
            font-weight: 400;
        }

        .form-container {
            background: var(--tg-theme-secondary-bg-color);
            border-radius: var(--border-radius);
            padding: 32px;
            box-shadow: var(--shadow);
            animation: slideUp 0.6s ease-out 0.2s both;
        }

        .form-group {
            margin-bottom: 24px;
            position: relative;
        }

        .form-group.error .form-input {
            border-color: var(--error-color);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }

        .form-group.success .form-input {
            border-color: var(--success-color);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.1);
        }

        .form-label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--tg-theme-text-color);
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid transparent;
            border-radius: 12px;
            font-size: 16px;
            background: var(--tg-theme-bg-color);
            color: var(--tg-theme-text-color);
            transition: var(--transition);
            outline: none;
        }

        .form-input:focus {
            border-color: var(--tg-theme-button-color);
            box-shadow: 0 0 0 3px rgba(36, 129, 204, 0.1);
            transform: translateY(-2px);
        }

        .form-input::placeholder {
            color: var(--tg-theme-hint-color);
        }

        .error-message {
            color: var(--error-color);
            font-size: 12px;
            margin-top: 6px;
            display: none;
            animation: fadeIn 0.3s ease-out;
        }

        .form-group.error .error-message {
            display: block;
        }

        .success-icon, .error-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            opacity: 0;
            transition: var(--transition);
        }

        .form-group.success .success-icon {
            opacity: 1;
            color: var(--success-color);
        }

        .form-group.error .error-icon {
            opacity: 1;
            color: var(--error-color);
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(36, 129, 204, 0.2);
            border-radius: 2px;
            margin-bottom: 24px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary-gradient);
            width: 0%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 2px;
        }

        .submit-button {
            width: 100%;
            padding: 18px;
            background: var(--tg-theme-button-color);
            color: var(--tg-theme-button-text-color);
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(36, 129, 204, 0.3);
        }

        .submit-button:active {
            transform: translateY(0);
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .loading-spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 2px solid transparent;
            border-top: 2px solid currentColor;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        .submit-button.loading .loading-spinner {
            display: inline-block;
        }

        .submit-button.loading .button-text {
            opacity: 0.7;
        }

        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-element {
            position: absolute;
            font-size: 20px;
            opacity: 0.1;
            animation: float 6s ease-in-out infinite;
        }

        .floating-element:nth-child(1) { top: 10%; left: 10%; animation-delay: 0s; }
        .floating-element:nth-child(2) { top: 20%; right: 10%; animation-delay: 1s; }
        .floating-element:nth-child(3) { top: 60%; left: 5%; animation-delay: 2s; }
        .floating-element:nth-child(4) { bottom: 20%; right: 15%; animation-delay: 3s; }
        .floating-element:nth-child(5) { bottom: 10%; left: 20%; animation-delay: 4s; }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {
                transform: translateY(0);
            }
            40% {
                transform: translateY(-10px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .success-animation {
            display: none;
            text-align: center;
            padding: 40px 20px;
        }

        .success-animation.show {
            display: block;
            animation: slideUp 0.6s ease-out;
        }

        .success-icon-large {
            font-size: 80px;
            color: var(--success-color);
            margin-bottom: 20px;
            animation: bounce 1s ease-out;
        }

        .success-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 12px;
            color: var(--success-color);
        }

        .success-message {
            color: var(--tg-theme-hint-color);
            font-size: 16px;
            line-height: 1.5;
        }

        /* Dark theme support */
        @media (prefers-color-scheme: dark) {
            :root {
                --tg-theme-bg-color: #1a1a1a;
                --tg-theme-text-color: #ffffff;
                --tg-theme-hint-color: #8e8e93;
                --tg-theme-secondary-bg-color: #2c2c2e;
            }
        }

        /* Responsive design */
        @media (max-width: 480px) {
            .container { padding: 16px; }
            .form-container { padding: 24px; }
            .header-title { font-size: 24px; }
            .header-icon { font-size: 56px; }
        }
    </style>
</head>
<body>
    <!-- Elementos flotantes decorativos -->
    <div class="floating-elements">
        <div class="floating-element">🏋️</div>
        <div class="floating-element">💪</div>
        <div class="floating-element">🎯</div>
        <div class="floating-element">⭐</div>
        <div class="floating-element">🚀</div>
    </div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-icon">👋</div>
            <h1 class="header-title">¡Bienvenido!</h1>
            <p class="header-subtitle">Completa tu perfil para comenzar tu jornada fitness</p>
        </div>

        <!-- Formulario de registro -->
        <div class="form-container" id="registrationForm">
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <form id="userForm">
                <div class="form-group" id="nameGroup">
                    <label for="name" class="form-label">Tu Nombre</label>
                    <input 
                        type="text" 
                        id="name" 
                        name="name" 
                        class="form-input" 
                        placeholder="Ej: Juan Pérez"
                        autocomplete="given-name"
                        required
                    >
                    <span class="success-icon">✓</span>
                    <span class="error-icon">✗</span>
                    <div class="error-message" id="nameError">Por favor ingresa tu nombre completo</div>
                </div>

                <div class="form-group" id="ageGroup">
                    <label for="age" class="form-label">Tu Edad</label>
                    <input 
                        type="number" 
                        id="age" 
                        name="age" 
                        class="form-input" 
                        placeholder="Ej: 25"
                        min="13"
                        max="120"
                        required
                    >
                    <span class="success-icon">✓</span>
                    <span class="error-icon">✗</span>
                    <div class="error-message" id="ageError">Ingresa una edad válida (13-120 años)</div>
                </div>

                <button type="submit" class="submit-button" id="submitButton">
                    <span class="loading-spinner"></span>
                    <span class="button-text">Completar Registro</span>
                </button>
            </form>
        </div>

        <!-- Animación de éxito -->
        <div class="success-animation" id="successAnimation">
            <div class="success-icon-large">🎉</div>
            <h2 class="success-title">¡Registro Completado!</h2>
            <p class="success-message">
                Tu perfil ha sido creado exitosamente.<br>
                Ahora puedes comenzar a crear tus rutinas de ejercicio.
            </p>
        </div>
    </div>

    <script>
        // Inicializar Telegram Web App
        const tg = window.Telegram.WebApp;
        
        // Configurar tema
        document.documentElement.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color || '#ffffff');
        document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color || '#000000');
        document.documentElement.style.setProperty('--tg-theme-hint-color', tg.themeParams.hint_color || '#999999');
        document.documentElement.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color || '#2481cc');
        document.documentElement.style.setProperty('--tg-theme-button-text-color', tg.themeParams.button_text_color || '#ffffff');
        document.documentElement.style.setProperty('--tg-theme-secondary-bg-color', tg.themeParams.secondary_bg_color || '#f1f1f1');

        // Expandir la WebApp
        tg.expand();

        // Variables globales
        const form = document.getElementById('userForm');
        const nameInput = document.getElementById('name');
        const ageInput = document.getElementById('age');
        const nameGroup = document.getElementById('nameGroup');
        const ageGroup = document.getElementById('ageGroup');
        const nameError = document.getElementById('nameError');
        const ageError = document.getElementById('ageError');
        const submitButton = document.getElementById('submitButton');
        const progressFill = document.getElementById('progressFill');
        const registrationForm = document.getElementById('registrationForm');
        const successAnimation = document.getElementById('successAnimation');

        // Validaciones
        function validateName() {
            const name = nameInput.value.trim();
            if (name.length < 2) {
                showError(nameGroup, nameError, 'El nombre debe tener al menos 2 caracteres');
                return false;
            }
            if (name.length > 50) {
                showError(nameGroup, nameError, 'El nombre no puede tener más de 50 caracteres');
                return false;
            }
            if (!/^[a-zA-ZáéíóúÁÉÍÓÚñÑ\s]+$/.test(name)) {
                showError(nameGroup, nameError, 'El nombre solo puede contener letras y espacios');
                return false;
            }
            showSuccess(nameGroup);
            return true;
        }

        function validateAge() {
            const age = parseInt(ageInput.value);
            if (isNaN(age) || age < 13 || age > 120) {
                showError(ageGroup, ageError, 'Ingresa una edad válida (13-120 años)');
                return false;
            }
            showSuccess(ageGroup);
            return true;
        }

        function showError(group, errorElement, message) {
            group.classList.add('error');
            group.classList.remove('success');
            errorElement.textContent = message;
        }

        function showSuccess(group) {
            group.classList.add('success');
            group.classList.remove('error');
        }

        function updateProgress() {
            const nameValid = validateName();
            const ageValid = validateAge();
            
            let progress = 0;
            if (nameValid) progress += 50;
            if (ageValid) progress += 50;
            
            progressFill.style.width = progress + '%';
            
            // Habilitar/deshabilitar botón
            submitButton.disabled = !(nameValid && ageValid);
        }

        // Event listeners para validación en tiempo real
        nameInput.addEventListener('input', () => {
            setTimeout(updateProgress, 300);
        });

        nameInput.addEventListener('blur', validateName);

        ageInput.addEventListener('input', () => {
            setTimeout(updateProgress, 300);
        });

        ageInput.addEventListener('blur', validateAge);

        // Envío del formulario
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!validateName() || !validateAge()) {
                return;
            }

            // Mostrar loading
            submitButton.classList.add('loading');
            submitButton.disabled = true;

            const formData = {
                name: nameInput.value.trim(),
                age: parseInt(ageInput.value),
                chat_id: tg.initDataUnsafe?.user?.id || 'test_user',
                timestamp: Date.now()
            };

            try {
                // Simular delay para mostrar la animación
                await new Promise(resolve => setTimeout(resolve, 1500));

                // Enviar datos de vuelta a Telegram
                tg.sendData(JSON.stringify(formData));
                
                // Mostrar animación de éxito
                registrationForm.style.display = 'none';
                successAnimation.classList.add('show');
                
                // Cerrar WebApp después de un delay
                setTimeout(() => {
                    tg.close();
                }, 3000);

            } catch (error) {
                console.error('Error al registrar usuario:', error);
                
                // Reset loading state
                submitButton.classList.remove('loading');
                submitButton.disabled = false;
                
                // Mostrar error
                tg.showAlert('Ocurrió un error al registrar tu perfil. Por favor intenta nuevamente.');
            }
        });

        // Configurar botón principal de Telegram
        tg.MainButton.text = 'Completar Registro';
        tg.MainButton.show();

        tg.MainButton.onClick(() => {
            form.dispatchEvent(new Event('submit'));
        });

        // Haptic feedback
        nameInput.addEventListener('focus', () => tg.HapticFeedback.impactOccurred('light'));
        ageInput.addEventListener('focus', () => tg.HapticFeedback.impactOccurred('light'));
        
        form.addEventListener('submit', () => tg.HapticFeedback.impactOccurred('medium'));

        // Inicializar
        updateProgress();
        
        // Auto-focus en el primer campo
        setTimeout(() => {
            nameInput.focus();
        }, 500);
    </script>
</body>
</html>
